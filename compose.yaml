name: odysseia-forum-webpage

services:
  forum-webpage:
    image: odysseia-forum-webpage:${IMAGE_TAG:-2.3.13-test}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /v1
        VITE_WORKS_API_URL: /v2
        VITE_WORKS_V2: "true"
        VITE_BACKEND_URL: ${VITE_BACKEND_URL:-https://test-forum.shimmerday.top}
        VITE_USE_MOCK: "false"
        VITE_API_MOCKING: "false"
        VITE_SHOW_DEVTOOLS: "false"
    ports:
      - "127.0.0.1:${WEB_PORT:-8081}:8080"
    restart: unless-stopped
    init: true
    read_only: true
    user: "101:101"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,uid=101,gid=101
    healthcheck:
      test: ["CMD", "/bin/busybox", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
